<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="phone.css"><link rel="stylesheet" href="library.css"><link rel="stylesheet" href="theme-dark.css"><link rel="stylesheet" href="video.css"><title>Library with videos</title><!-- mock 11a (#102). 360 wide. --></head><body><header class="bar"><button class="back" aria-label="Back to home">‹</button><div class="name">Photos</div></header><div class="status"><span class="ok"></span>Connected to the frame · 212 GB free</div><main><button class="btn btn-primary btn-big block">＋&nbsp; Upload</button><p class="upnote">Photos and videos. Videos play silently, up to 30 seconds. The frame keeps its own copy, not your original.</p><div class="libhead"><h1>Library<small>96 photos · 14 videos</small></h1><button class="btn btn-neutral btn-select">Select</button></div>
<div class="chips" role="group" aria-label="Show"><button class="chip" aria-pressed="true">Photos</button><button class="chip" aria-pressed="true">Videos</button></div><p class="chiphint"></p>
<ul class="lib"><li><button class="tile" aria-label="Video 1 of 110, 0:24"><img src="../assets/thumb-1.jpg" alt=""><span class="badge">▶ 0:24</span></button></li><li><button class="tile" aria-label="Photo"><img src="../assets/thumb-2.jpg" alt=""></button></li><li><button class="tile" aria-label="Video 3 of 110, 0:09"><img src="../assets/thumb-3.jpg" alt=""><span class="badge">▶ 0:09</span></button></li>
<li><div class="tile" aria-label="Video waiting"><img src="../assets/thumb-4.jpg" alt=""><span class="state">Waiting</span></div></li>
<li><div class="tile" aria-label="Video preparing"><img src="../assets/thumb-5.jpg" alt=""><span class="state"><span class="spin"></span>Preparing</span></div></li>
<li><div class="tile" style="background:var(--mf-red-50)" aria-label="Video failed"><span class="state fail">Couldn't add<div class="acts"><button class="vretry" aria-label="Retry video"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="vremove" aria-label="Remove video"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button></div></span></div></li>
<li><button class="tile" aria-label="Photo"><img src="../assets/thumb-6.jpg" alt=""></button></li><li><button class="tile" aria-label="Video 8 of 110, 0:30"><img src="../assets/thumb-1.jpg" alt=""><span class="badge">▶ 0:30</span></button></li><li><button class="tile" aria-label="Photo"><img src="../assets/thumb-3.jpg" alt=""></button></li></ul></main></body></html>
