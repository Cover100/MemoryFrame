:root{--mf-ink:#0E1311;--mf-forest-900:#16261D;--mf-linen:#F3EDE4;--mf-oat:#C9BBA8;--mf-brass:#D6B36A;
  --mf-ease:cubic-bezier(.2,.7,.2,1);
  --mf-font-frame:"MF Frame","Atkinson Hyperlegible","DejaVu Sans","Liberation Sans",sans-serif;--breath:2800ms}
html,body{margin:0;width:800px;height:480px;background:var(--mf-ink);overflow:hidden;cursor:none;
  user-select:none;-webkit-user-select:none}
#splash{position:fixed;inset:0;background:var(--mf-ink);color:var(--mf-linen);font-family:var(--mf-font-frame)}
.lockup{position:absolute;left:50%;top:50%;width:360px;height:172px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.mark{width:132px;height:100px;box-sizing:border-box;border:5px solid var(--mf-brass);border-radius:16px;background:var(--mf-forest-900);
  display:flex;align-items:center;justify-content:center}
.dot{width:28px;height:28px;border-radius:50%;background:var(--mf-brass)}
/* The name is Wren's wordmark PNG (282x35, no scaling, at (39,135) of the 360x172 lockup), inlined as a data URI: no font to wait for,
   so it is never missing at first paint. */
.word{display:block;width:282px;height:35px;margin-top:35px}
.late{position:absolute;left:0;right:0;top:calc(50% + 142px);text-align:center;font-size:22px;line-height:1.3;color:var(--mf-oat);opacity:0}
/* The pulse (Wren, 20 Nov): only the dot moves. It starts and ends at REST (opacity 1, 28 px = wren-A-static.png, what Plymouth's last
   frame and swaybg show), dips to opacity .3 at scale .75, every 2.8 s on a sine in-out. No delay: it begins at rest. The same
   numbers drive the Plymouth theme (deploy/plymouth/memoryframe/memoryframe.script) and the app overlay (static/boot.css). */
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.75)}}
.dot{animation:breathe var(--breath) cubic-bezier(.37,0,.63,1) infinite}
@keyframes lateIn{to{opacity:1}}
.late{animation:lateIn 800ms var(--mf-ease) 20s forwards}
@media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:1;transform:none}}

<script>
"use strict";
// Wait for the app, then hand over to it (/?boot=1: the app page shows the same lockup until its first paint).
// next must be the frame's own app: http://localhost[:port] or http://127.0.0.1[:port], nothing else.
(function(){
  const q = new URLSearchParams(location.search);
  const num = (k, d)=>{ const v = Number(q.get(k)); return Number.isFinite(v) && v > 0 ? v : d; };
  // MIN_DWELL_S: how long (seconds) this page stays up, pulsing, before it opens the app even if the app is already running.
  // 0 = off (the default): the app opens on the first /healthz answer, which on a normal boot is under a second after Chromium
  // paints. Set it to 2.8 (one full pulse) to guarantee the pulse is seen once, at the cost of up to that much extra boot time.
  const MIN_DWELL_S = 0;
  const POLL = num("poll", 1000), E2_AFTER = num("e2", 150000), LATE = num("late", 0);   // test overrides (ms)
  const DWELL = num("dwell", MIN_DWELL_S * 1000);
  if(LATE){ document.querySelector(".late").style.animationDelay = LATE + "ms"; }
  const m = /^(http:\/\/(?:localhost|127\.0\.0\.1)(?::\d{1,5})?)\/?$/.exec(q.get("next") || "");
  window.mfSplash = {next: m ? m[1] : null, done: false};
  if(!m){ return; }                            // not our app: stay on the splash (kiosk.sh shows E2 later)
  const next = m[1], t0 = Date.now();
  function phase(){                            // where the breath is (0..2800 ms), so the overlay continues it
    const a = document.getAnimations().find(x=>x.animationName === "breathe");
    const p = a && a.effect && a.effect.getComputedTiming().progress;
    return typeof p === "number" ? Math.round(p * 2800) : 0;
  }
  function go(url){ if(window.mfSplash.done){ return; } window.mfSplash.done = true; location.replace(url); }
  async function poll(){
    if(window.mfSplash.done){ return; }
    const ac = new AbortController(), t = setTimeout(()=>ac.abort(), 2000);
    try{
      await fetch(next + "/healthz", {mode: "no-cors", cache: "no-store", signal: ac.signal});
      clearTimeout(t);
      const wait = DWELL - (Date.now() - t0);
      if(wait > 0){ await new Promise(r=>setTimeout(r, wait)); }   // MIN_DWELL_S: keep pulsing a little longer
      go(next + "/?boot=1&bp=" + phase());
      return;
    }catch(e){ clearTimeout(t); }
    if(Date.now() - t0 >= E2_AFTER){           // E2: the app never answered
      go("error.html?e=E2&next=" + encodeURIComponent(next));
      return;
    }
    setTimeout(poll, POLL);
  }
  poll();
})();
</script>
