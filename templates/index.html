<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">


    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>
        Memory Frame
    </title>


    <link rel="stylesheet"
          href="/static/style.css">

</head>



<body>


<div id="frame">


    <!-- ==========================================
         Media Layers

         Only one is visible at a time.
         Two layers allow smooth crossfade.
         ========================================== -->


    <img
        id="image"
        class="media"
        draggable="false"
        alt=""
    >



    <video
        id="video"
        class="media"
        muted
        playsinline
        preload="auto">
    </video>



    <!-- ==========================================
         Brightness Indicator

         Hidden normally.
         Appears during brightness adjustment.
         ========================================== -->


    <div id="brightnessOverlay">

        <span id="brightnessIcon">
            ☀
        </span>


        <span id="brightnessValue">
            100%
        </span>

    </div>



    <!-- ==========================================
         Future Clock Overlay

         Currently hidden.
         We will enable later.
         ========================================== -->


    <!-- MF-12 pairing overlay (static/pairing.js) -->
    <div id="pairOverlay" aria-live="polite">
        <div id="pairBox">
            <div id="pairQr"></div>
            <div id="pairText">
                <div id="pairTitle">Pair your phone</div>
                <div id="pairSsid"></div>
                <div id="pairCode">--- ---</div>
                <div id="pairHint">Scan the code, or open <span id="pairUrl"></span> and enter the number.</div>
                <button id="pairClose" type="button" hidden>Close</button>
                <button id="pairSignOut" type="button" hidden>Sign out all phones</button>
            </div>
        </div>
    </div>


    <div id="clockOverlay">

    </div>



</div>




<script id="mediaData" type="application/json">{{ media | tojson }}</script>

<script src="/static/media-data.js"></script>



<script src="/static/script.js"></script>

<script src="/static/pairing.js"></script>



</body>

</html>
