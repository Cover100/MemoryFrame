<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair with Memory Frame</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:28rem;margin:2rem auto;padding:0 1rem;color:#222}
 input{font-size:2rem;letter-spacing:.3em;width:100%;padding:.4rem;text-align:center;box-sizing:border-box}
 button{font-size:1.3rem;width:100%;padding:.7rem;margin-top:1rem}
 .err{color:#b00020}
</style>
</head>
<body>
<h1>Pair this phone</h1>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
{% if token %}
<form method="post" action="/pair" id="tokenForm">
  <input type="hidden" name="token" value="{{ token }}">
  <p>You scanned the code on the frame.</p>
  <button type="submit">Pair this phone</button>
</form>
{% endif %}
<form method="post" action="/pair">
  <p>Enter the 6-digit code shown on the frame:</p>
  <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
  <button type="submit">Pair</button>
</form>
</body>
</html>
