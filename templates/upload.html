{% extends "_phone.html" %}
{% block title %}Upload photos - Memory Frame{% endblock %}
{% block heading %}Upload photos{% endblock %}
{% block content %}
<p id="storage" class="muted small">Checking free space...</p>
<label class="pick btn btn-neutral block big"><span id="pickLabel">Choose photos</span>
  <input id="files" type="file" accept="image/*,.heic,.heif" multiple>
</label>
<div id="summary" class="ok-box" aria-live="polite"></div>
<ul id="list" class="mt"></ul>
{% endblock %}
{% block scripts %}<script src="{{ static('upload.js') }}"></script>{% endblock %}
